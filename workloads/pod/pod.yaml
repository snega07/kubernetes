apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  labels:
    app: my-app
spec:
  initContainers:
    - name: init-myservice
      image: busybox
      command: ['sh', '-c']
      args: ['until nslookup myservice.default.svc.cluster.local; do echo waiting for myservice; sleep 2; done;']
    - name: init-myservice2
      image: busybox
      command: ['sh', '-c']
      args: ['until nslookup myservice.default.svc.cluster.local; do echo waiting for myservice2; sleep 2; done;']
  containers:
  - name: my-container
    image: busybox
    ports:
    - containerPort: 80
    command: ["sh", "-c"]
    args: ["while true; do echo Hello Kubernetes!; sleep 10; done"]